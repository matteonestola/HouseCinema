name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Genera js/firebase-config.js dai secret del repository
        run: |
          cat > js/firebase-config.js <<EOF
          export const firebaseConfig = {
            apiKey: "${{ secrets.APIKEY }}",
            authDomain: "${{ secrets.AUTHDOMAIN }}",
            projectId: "${{ secrets.PROJECTID }}",
            storageBucket: "${{ secrets.STORAGEBUCKET }}",
            messagingSenderId: "${{ secrets.MESSAGINGSENDERID }}",
            appId: "${{ secrets.APPID }}",
            measurementId: "${{ secrets.MEASUREMENTID }}"
          };
          EOF

      - name: Genera l'elenco delle copertine (background_img/manifest.json)
        run: |
          mkdir -p background_img
          (cd background_img && ls | grep -iE '\.(jpe?g|png|webp|avif|gif)$' | jq -R . | jq -sc .) > background_img/manifest.json
          cat background_img/manifest.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
